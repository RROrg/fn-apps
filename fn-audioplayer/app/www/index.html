<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>音频播放器</title>
  <link rel="stylesheet" href="/app/fn-audioplayer/style.css">
</head>

<body>
  <div class="player">
    <div class="player-left">
      <div class="disc-area">
        <button class="about-btn" id="btnAbout" onclick="openAbout()" data-i18n="about" title="关于">关于</button>
        <div class="disc-wrapper">
          <div class="disc" id="disc">
            <div class="disc-grooves"></div>
            <img class="disc-cover is-hidden" id="discCover" alt="">
            <div class="disc-label" id="discLabel">
              <svg viewBox="0 0 24 24">
                <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55C7.79 13 6 14.79 6 17s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z" />
              </svg>
            </div>
            <div class="disc-hole"></div>
          </div>
        </div>

        <div class="track-info">
          <div class="track-title" id="trackTitle" data-i18n="waitingToPlay">等待播放</div>
          <div class="track-subtitle" id="trackSubtitle" data-i18n="selectAudioToStart">选择音频文件开始</div>
        </div>
      </div>

      <div class="progress-section">
        <div class="progress-bar" id="progressBar">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="time-row">
          <span id="currentTime">0:00</span>
          <span id="duration">0:00</span>
        </div>
      </div>

      <div class="controls">
        <button class="ctrl-btn" id="prevBtn" title="上一首">
          <svg viewBox="0 0 24 24">
            <path d="M6 6h2v12H6zm3.5 6 8.5 6V6z" />
          </svg>
        </button>
        <button class="ctrl-btn play-btn" id="playPauseBtn" title="播放">
          <svg viewBox="0 0 24 24" id="playIcon">
            <path d="M8 5v14l11-7z" />
          </svg>
        </button>
        <button class="ctrl-btn" id="nextBtn" title="下一首">
          <svg viewBox="0 0 24 24">
            <path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z" />
          </svg>
        </button>
      </div>

      <div class="volume-section">
        <div class="volume-icon">
          <svg viewBox="0 0 24 24">
            <path
              d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z" />
          </svg>
        </div>
        <input type="range" class="volume-slider" id="volumeSlider" min="0" max="100" value="70" title="音量">
        <span class="volume-val" id="volumeValue">70%</span>
      </div>

      <div class="toolbar-row" id="toolbarRow">
        <div class="toolbar-label" data-i18n="playbackSetting">播放设置</div>
        <button class="toolbar-btn" id="sortModeBtn" onclick="cycleSortMode()" title="播放顺序">
          <svg viewBox="0 0 24 24" id="sortModeIcon">
            <path d="M3 15h6v-2H3v2zm0 4h6v-2H3v2zm0-8h6V9H3v2zm0-6v2h6V5H3zm10 0v14l7-7z" />
          </svg>
          <span id="sortModeText">顺序播放</span>
        </button>
        <button class="toolbar-btn" id="lyricsAlignBtn" onclick="cycleLyricsAlign()" title="歌词对齐">
          <svg viewBox="0 0 24 24" id="lyricsAlignIcon">
            <path d="M3 3h18v2H3zm0 4h12v2H3zm0 4h18v2H3zm0 4h12v2H3z" />
          </svg>
          <span id="lyricsAlignText">靠左</span>
        </button>
      </div>

      <div class="output-section">
        <div class="toolbar-label" data-i18n="outputDevice">输出设备</div>
        <div class="output-mode-btns">
          <button class="output-mode-btn active" id="modeClientBtn" onclick="setOutputMode('client')"
            data-i18n="clientMode">客户端</button>
          <button class="output-mode-btn" id="modeServerBtn" onclick="setOutputMode('server')"
            data-i18n="serverMode">服务器</button>
        </div>
        <select class="output-select is-hidden" id="serverDeviceSelect" onchange="onServerDeviceChange()"
          title="选择输出设备">
          <option value="" data-i18n="noDevices">未检测到音频设备</option>
        </select>
      </div>

      <div class="add-section">
        <div class="add-btns">
          <input type="file" id="fileInput" class="file-input" multiple accept="audio/*" title="选择音频文件">
          <button class="add-btn" onclick="document.getElementById('fileInput').click()">
            <svg viewBox="0 0 24 24">
              <path d="M9 16h6v-6h4l-7-7-7 7h4zm-4 2h14v2H5z" />
            </svg>
            <span data-i18n="addLocal">本地上传</span>
          </button>
          <button class="add-btn" onclick="openBrowser()">
            <svg viewBox="0 0 24 24">
              <path d="M10 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z" />
            </svg>
            <span data-i18n="addFromNas">NAS浏览</span>
          </button>
        </div>
      </div>
    </div>

    <div class="player-right">
      <div class="tab-bar">
        <button class="tab-btn" data-tab="lyrics" id="tabLyrics">
          <svg viewBox="0 0 24 24">
            <path
              d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z" />
          </svg>
          <span data-i18n="lyrics">歌词</span>
        </button>
        <button class="tab-btn active" data-tab="playlist" id="tabPlaylist">
          <svg viewBox="0 0 24 24">
            <path
              d="M15 6H3v2h12V6zm0 4H3v2h12v-2zM3 16h8v-2H3v2zM17 6v8.18c-.31-.11-.65-.18-1-.18-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3V8h3V6h-5z" />
          </svg>
          <span data-i18n="playlist">播放列表</span>
        </button>
      </div>

      <div class="tab-panel" id="panelLyrics">
        <div class="panel-header">
          <svg viewBox="0 0 24 24">
            <path
              d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z" />
          </svg>
          <span data-i18n="lyrics">歌词</span>
        </div>
        <div class="lyrics-section">
          <div class="lyrics-container" id="lyricsContainer">
            <div class="lyrics-empty">
              <svg viewBox="0 0 24 24">
                <path
                  d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z" />
              </svg>
              <span data-i18n="noLyrics">暂无歌词</span>
            </div>
          </div>
        </div>
      </div>

      <div class="tab-panel active" id="panelPlaylist">
        <div class="panel-header">
          <svg viewBox="0 0 24 24">
            <path
              d="M15 6H3v2h12V6zm0 4H3v2h12v-2zM3 16h8v-2H3v2zM17 6v8.18c-.31-.11-.65-.18-1-.18-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3V8h3V6h-5z" />
          </svg>
          <span data-i18n="playlist">播放列表</span>
        </div>
        <div class="playlist-section">
          <div class="playlist-items" id="playlistItems">
            <div class="playlist-empty" data-i18n="noTracks">暂无曲目，请添加音频文件</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="browserOverlay">
    <div class="modal">
      <div class="modal-header">
        <h3 data-i18n="browseFiles">浏览文件</h3>
        <button class="modal-close" onclick="closeBrowser()">&times;</button>
      </div>
      <div class="modal-path" id="browserPath">
        <svg viewBox="0 0 24 24">
          <path d="M10 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z" />
        </svg>
        <span id="browserPathText">/</span>
      </div>
      <div class="modal-body" id="browserBody">
        <div class="browse-loading" data-i18n="loading">加载中...</div>
      </div>
      <div class="modal-footer">
        <button class="modal-btn cancel" onclick="closeBrowser()" data-i18n="cancel">取消</button>
        <button class="modal-btn confirm" id="browserConfirm" onclick="confirmBrowser()" disabled
          data-i18n="addSelected">添加选中</button>
      </div>
    </div>
  </div>

  <div class="about-overlay" id="aboutOverlay">
    <div class="about-modal">
      <div class="about-modal-header">
        <h3 data-i18n="about">关于</h3>
        <button class="about-modal-close" onclick="closeAbout()">&times;</button>
      </div>
      <div class="about-modal-body">
        <div class="about-section">
          <p class="about-declaration" data-i18n="aboutDeclaration">本项目由社区维护，免费开源，仅用于学习与交流，请遵守所在地法律法规与平台服务条款。</p>
        </div>
        <div class="about-section">
          <h4 data-i18n="communitySupport">社区支持</h4>
          <ul class="about-list">
            <li>QQ 群：130359605 · <a href="https://qm.qq.com/q/xMUyJacSIw" target="_blank" rel="noopener noreferrer"
                data-i18n="join">点击加入</a></li>
            <li>Github：<a href="https://github.com/RROrg/fn-apps" target="_blank"
                rel="noopener noreferrer">RROrg/fn-apps</a></li>
          </ul>
        </div>
        <div class="about-section">
          <h4 data-i18n="sponsorSupport">赞助支持</h4>
          <img class="about-sponsor-image" src="https://fastly.jsdelivr.net/gh/wjz304/wjz304@master/my/buymeacoffee.png"
            alt="sponsoring">
        </div>
        <div class="about-copyright">
          <a href="https://github.com/RROrg" target="_blank" rel="noopener noreferrer">RROrg</a>
          <a href="https://github.com/wjz304" target="_blank" rel="noopener noreferrer">wjz304</a>
          <span>© 2026 RROrg, Ing, Inc.</span>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <audio id="audioPlayer"></audio>

  <script src="/app/fn-audioplayer/app.js"></script>
</body>

</html>
