<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="appTitle">无线热点</title>
  <link rel="stylesheet" href="/app/fn-wifi-hotspot/style.css">
</head>

<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <h1 data-i18n="appTitle">无线热点</h1>
        <p id="statusSummary" data-i18n="loading">正在加载...</p>
      </div>
      <div class="row-actions">
        <button id="btnAbout" class="ghost-btn" type="button" data-i18n="about">关于</button>
        <button id="refreshBtn" class="ghost-btn" type="button" data-i18n="refresh">刷新</button>
        <button id="toggleBtn" class="primary-btn" type="button" disabled data-i18n="start">开启热点</button>
      </div>
    </header>

    <main class="content">
      <section class="panel">
        <div class="section-head">
          <h2 data-i18n="status">状态</h2>
        </div>
        <div class="stats-grid">
          <div class="stat"><span data-i18n="hotspotDevice">热点网卡</span><strong id="statIface">-</strong></div>
          <div class="stat"><span data-i18n="uplink">共享网卡</span><strong id="statUplink">-</strong></div>
          <div class="stat"><span data-i18n="address">地址</span><strong id="statIp">-</strong></div>
          <div class="stat"><span data-i18n="internet">互联网</span><strong id="statInternet">-</strong></div>
        </div>
      </section>

      <section class="panel">
        <div class="section-head">
          <h2 data-i18n="config">配置</h2>
          <button id="saveBtn" class="primary-btn" type="button" disabled data-i18n="save">保存</button>
        </div>
        <form id="configForm" class="grid">
          <label class="field">
            <span data-i18n="hotspotDevice">热点网卡</span>
            <select name="iface" id="ifaceSelect"></select>
          </label>
          <label class="field">
            <span data-i18n="uplink">共享网卡</span>
            <select name="uplinkIface" id="uplinkSelect"></select>
          </label>
          <label class="field">
            <span data-i18n="ssid">SSID</span>
            <input name="ssid" autocomplete="off">
          </label>
          <label class="field">
            <span data-i18n="password">密码</span>
            <span class="pw-wrap">
              <input name="password" type="password" autocomplete="off">
              <button type="button" class="pw-toggle" data-pw-toggle aria-label="显示密码" aria-pressed="false"
                tabindex="-1">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"
                  stroke-linecap="round" stroke-linejoin="round" class="eye-open" aria-hidden="true">
                  <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"
                  stroke-linecap="round" stroke-linejoin="round" class="eye-closed" aria-hidden="true">
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"></path>
                  <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"></path>
                  <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"></path>
                  <line x1="1" y1="1" x2="23" y2="23"></line>
                </svg>
              </button>
            </span>
          </label>
          <label class="field">
            <span data-i18n="ipCidr">IP/CIDR</span>
            <input name="ipCidr" placeholder="192.168.12.1/24" autocomplete="off">
          </label>
          <label class="field">
            <span data-i18n="allowPorts">放行端口</span>
            <input name="allowPorts" placeholder="80,443,5666,5667,67-68/udp" autocomplete="off">
          </label>
          <label class="field">
            <span class="field-label"><span data-i18n="country">国家码</span><span id="countryLocked"
                class="field-hint hidden"><svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                  stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z">
                  </path>
                  <line x1="12" y1="9" x2="12" y2="13"></line>
                  <line x1="12" y1="17" x2="12.01" y2="17"></line>
                </svg><span data-i18n="countryLockedHint">当前系统不允许修改国家码</span></span></span>
            <select name="countryCode" id="countrySelect"></select>
          </label>
          <label class="field">
            <span data-i18n="band">频段</span>
            <select name="band">
              <option value="bg">2.4G</option>
              <option value="a">5G</option>
            </select>
          </label>
          <label class="field">
            <span data-i18n="channel">信道</span>
            <select name="channel" id="channelSelect"></select>
          </label>
          <label class="field">
            <span data-i18n="width">带宽</span>
            <select name="channelWidth">
              <option value="20">20 MHz</option>
              <option value="40">40 MHz</option>
              <option value="80">80 MHz</option>
              <option value="160">160 MHz</option>
            </select>
          </label>
        </form>
      </section>

      <section class="panel">
        <div class="section-head">
          <h2 data-i18n="clients">客户端</h2>
          <span id="clientCount" class="meta">0</span>
        </div>
        <div id="clients" class="client-list"></div>
      </section>
    </main>
  </div>

  <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-content">
      <h2 id="modalTitle"></h2>
      <div id="modalBody"></div>
      <div class="modal-actions">
        <button id="modalCancel" class="ghost-btn" type="button" data-i18n="cancel">取消</button>
        <button id="modalOk" class="primary-btn" type="button" data-i18n="confirm">确定</button>
      </div>
    </div>
  </div>
  <div id="aboutModal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-content">
      <div class="about-modal-header">
        <h2 data-i18n="about">关于</h2>
        <button class="icon-btn" data-close type="button" data-i18n-title="close" aria-label="关闭">×</button>
      </div>
      <div class="about-body">
        <div class="about-section">
          <p class="about-declaration" data-i18n="aboutDeclaration">本项目由社区维护，免费开源，仅用于学习与交流，请遵守所在地法律法规与平台服务条款。</p>
        </div>
        <div class="about-section">
          <h3 data-i18n="communitySupport">社区支持</h3>
          <ul class="about-list">
            <li>QQ 群：130359605 · <a href="https://qm.qq.com/q/xMUyJacSIw" target="_blank" rel="noopener noreferrer"
                data-i18n="join">点击加入</a></li>
            <li>Github：<a href="https://github.com/RROrg/fn-apps" target="_blank"
                rel="noopener noreferrer">RROrg/fn-apps</a></li>
          </ul>
        </div>
        <div class="about-section">
          <h3 data-i18n="sponsorSupport">赞助支持</h3>
          <img class="about-sponsor-image" src="https://fastly.jsdelivr.net/gh/wjz304/wjz304@master/my/buymeacoffee.png"
            alt="sponsoring" loading="lazy" decoding="async">
        </div>
        <div class="about-copyright">
          <a href="https://github.com/RROrg" target="_blank" rel="noopener noreferrer">RROrg</a>
          <a href="https://github.com/wjz304" target="_blank" rel="noopener noreferrer">wjz304</a>
          <span>© 2026 RROrg, Ing, Inc.</span>
        </div>
      </div>
    </div>
  </div>
  <div id="toast" class="toast hidden"></div>
  <script type="module" src="/app/fn-wifi-hotspot/app.js"></script>
</body>

</html>
